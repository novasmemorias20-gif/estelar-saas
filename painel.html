<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --azul: #2563eb;
  --azul-escuro: #1d4ed8;
  --azul-tinta: #eff6ff;
  --ciano: #06b6d4;
  --gradiente: linear-gradient(135deg, var(--azul), var(--ciano));
  --ambar: #f59e0b;
  --ambar-escuro: #b45309;
  --escuro: #0f172a;
  --cinza-texto: #64748b;
  --cinza-linha: #e2e8f0;
  --cinza-claro: #f8fafc;
  --superficie: #ffffff;
  --erro: #ef4444;
  --erro-bg: #fee2e2;
  --sucesso: #16a34a;
  --sucesso-bg: #dcfce7;
  --sombra: 0 1px 2px rgba(15,23,42,.05), 0 6px 16px rgba(15,23,42,.06);
  --sombra-flutuante: 0 8px 28px rgba(15,23,42,.14);
}
html[data-tema="escuro"] {
  --azul-tinta: #1e293b;
  --escuro: #e2e8f0;
  --cinza-texto: #94a3b8;
  --cinza-linha: #334155;
  --cinza-claro: #0b1220;
  --superficie: #161e2e;
  --erro-bg: #3f1d1d;
  --sucesso-bg: #10301f;
  --sombra: 0 1px 2px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.35);
  --sombra-flutuante: 0 8px 28px rgba(0,0,0,.45);
}
html[data-tema="escuro"] input, html[data-tema="escuro"] select {
  background: var(--superficie);
  color: var(--escuro);
}
html[data-tema="escuro"] .cal-tem { background: #1e3a5f; }
html[data-tema="escuro"] .add-btn { background: #2d2410; }
html[data-tema="escuro"] .add-btn:hover { background: #3a2f14; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--cinza-claro);
  color: var(--escuro);
  font-variant-numeric: tabular-nums;
}
h1, h2, h3 { font-family: "Manrope", "Inter", sans-serif; letter-spacing: -0.01em; }
.container { max-width: 480px; margin: 0 auto; padding: 20px 16px calc(96px + env(safe-area-inset-bottom)); }
@media (min-width: 700px) { .container { max-width: 620px; } }
.card { background: var(--superficie); border: 1px solid var(--cinza-linha); border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: var(--sombra); }
h2, h3 { color: var(--escuro); margin-top: 0; }
h2 { font-weight: 800; }
h3 { font-weight: 800; font-size: 16px; }
label { display: block; font-size: 12.5px; font-weight: 600; margin: 12px 0 5px; color: var(--cinza-texto); }
label:first-child { margin-top: 0; }
input, select {
  width: 100%; padding: 11px 13px; border: 1.5px solid var(--cinza-linha);
  border-radius: 10px; font-size: 15px; color: var(--escuro); background: var(--superficie);
  font-family: inherit; transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px var(--azul-tinta); }
.btn {
  display: inline-block; width: 100%; padding: 13px 16px; border-radius: 12px; border: none;
  background: var(--gradiente); color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; margin-top: 16px; text-align: center; text-decoration: none;
  box-shadow: 0 4px 14px rgba(37,99,235,.28); transition: transform .1s, box-shadow .15s;
}
.btn:hover { box-shadow: 0 6px 18px rgba(37,99,235,.36); }
.btn:active { transform: scale(.98); }
.btn-secundario { background: var(--superficie); color: var(--azul); border: 1.5px solid var(--cinza-linha); box-shadow: none; }
.btn-secundario:hover { background: var(--azul-tinta); border-color: var(--azul); box-shadow: none; }
.btn-ambar { background: var(--ambar); color: #1a1200; box-shadow: 0 4px 14px rgba(245,158,11,.3); }
.btn-ambar:hover { filter: brightness(1.03); box-shadow: 0 6px 18px rgba(245,158,11,.38); }
.msg { font-size: 13.5px; margin-top: 8px; min-height: 18px; font-weight: 500; }
.msg.erro { color: var(--erro); }
.msg.ok { color: var(--sucesso); }

/* Navegação inferior fixa */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; background: var(--superficie); border-top: 1px solid var(--cinza-linha);
  box-shadow: 0 -4px 20px rgba(15,23,42,.06);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 1px; cursor: pointer; color: #94a3b8; font-weight: 600; font-size: 9.5px;
  border-radius: 10px; transition: color .15s; min-width: 0;
}
.tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.tab svg { width: 19px; height: 19px; }
.tab.ativa { color: var(--azul); }
.tab.ativa svg { filter: drop-shadow(0 2px 6px rgba(37,99,235,.35)); }
.badge-plano {
  display: inline-block; background: var(--azul-tinta); color: var(--azul-escuro); font-size: 11px;
  font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .02em;
}
.topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.topo .btn { width: auto; margin: 0; padding: 9px 14px; }
.marca-dagua { text-align: center; font-size: 11px; color: var(--cinza-texto); margin-top: 20px; opacity: 0.6; }

/* Calculadora */
details { margin-top: 4px; }
summary { cursor: pointer; color: var(--azul); font-size: 13px; font-weight: 700; padding: 8px 0; }
.price-grid { display: grid; grid-template-columns: 1fr 90px; gap: 8px 10px; align-items: center; margin-top: 10px; }
.price-grid span { font-size: 12px; color: var(--cinza-texto); }
.price-grid input { padding: 7px; font-size: 12px; }
.note { font-size: 11.5px; color: var(--cinza-texto); margin-top: 10px; line-height: 1.5; }
.item-card {
  background: var(--cinza-claro); border: 1px solid var(--cinza-linha); border-left: 3px solid var(--azul);
  border-radius: 14px; padding: 15px; margin-bottom: 12px;
}
.item-header { display: flex; justify-content: space-between; align-items: center; }
.item-header span { font-size: 13px; font-weight: 700; color: var(--azul-escuro); }
.remove-btn {
  background: var(--superficie); border: 1px solid var(--cinza-linha); color: var(--cinza-texto);
  border-radius: 8px; width: 28px; height: 28px; font-size: 13px; cursor: pointer;
}
.remove-btn:hover { color: var(--erro); border-color: var(--erro); }
.item-subtotal {
  margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--cinza-linha);
  display: flex; justify-content: space-between; font-size: 13px; color: var(--cinza-texto);
}
.item-subtotal b { color: var(--escuro); }
.add-btn {
  width: 100%; padding: 13px; border-radius: 14px; border: 1.5px dashed var(--ambar);
  background: #fffbeb; color: var(--ambar-escuro); font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 14px;
}
.add-btn:hover { background: #fef3c7; }
.checkbox-row { display: flex; align-items: center; gap: 9px; margin-top: 14px; }
.checkbox-row input { width: 19px; height: 19px; accent-color: var(--azul); }
.checkbox-row label { margin: 0; color: var(--escuro); font-size: 14px; font-weight: 500; }
.result {
  background: var(--gradiente); border-radius: 18px; padding: 20px; text-align: center;
  box-shadow: 0 10px 30px rgba(37,99,235,.28);
}
.result .label { color: #dbf3fb; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.result .value { color: #fff; font-size: 34px; font-weight: 800; margin: 4px 0; font-family: "Manrope", sans-serif; }
.breakdown { margin-top: 10px; font-size: 12px; color: #e0f2fe; text-align: left; }
.breakdown div { display: flex; justify-content: space-between; padding: 2px 0; }
.hidden { display: none !important; }

/* Proposta cliente */
.proposal { background: #ffffff; color: #0f172a; border-radius: 18px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: var(--sombra); }
.proposal-header { background: var(--gradiente); padding: 24px 20px; color: #fff; }
.proposal-header .brand { font-size: 21px; font-weight: 800; font-family: "Manrope", sans-serif; }
.proposal-header .tagline { font-size: 12px; color: #e0f2fe; margin-top: 2px; }
.proposal-numero { font-size: 11px; color: #d6f0fa; margin-top: 6px; }
.proposal-meta { padding: 16px 20px 4px; }
.proposal-items { padding: 6px 20px 4px; }
.proposal-item { padding: 12px 0; border-bottom: 1px solid #e2e8f0; }
.proposal-item .titulo { font-weight: 700; font-size: 14px; color: #0f172a; }
.proposal-item .detalhe { font-size: 12px; color: #64748b; margin-top: 2px; }
.proposal-item .preco { font-weight: 700; color: var(--azul); font-size: 14px; margin-top: 6px; text-align: right; }
.proposal-total { margin: 10px 20px 0; padding: 16px; border-radius: 14px; background: #0f172a; color: #fff; display: flex; justify-content: space-between; align-items: center; }
.proposal-total .lbl { font-size: 12px; color: #cbd5e1; text-transform: uppercase; font-weight: 600; }
.proposal-total .val { font-size: 22px; font-weight: 800; color: var(--ambar); font-family: "Manrope", sans-serif; }
.proposal-total-desconto { margin: 8px 20px 0; padding: 16px; border-radius: 14px; background: var(--sucesso); color: #fff; display: flex; justify-content: space-between; align-items: center; }
.proposal-total-desconto .lbl { font-size: 12px; color: #dcfce7; text-transform: uppercase; font-weight: 600; }
.proposal-total-desconto .val { font-size: 22px; font-weight: 800; color: #fff; font-family: "Manrope", sans-serif; }
.proposal-condicoes { margin: 16px 20px 0; padding: 14px 16px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; font-size: 11.5px; color: #475569; line-height: 1.6; }
.proposal-condicoes b { display: block; color: #0f172a; font-size: 12.5px; margin-bottom: 4px; }
.proposal-footer { padding: 16px 20px 4px; font-size: 11px; color: #64748b; line-height: 1.5; }
.proposal-marca { padding: 10px 20px 18px; font-size: 10px; color: #94a3b8; text-align: center; border-top: 1px solid #e2e8f0; margin-top: 4px; }
.action-row { display: flex; gap: 8px; margin-top: 14px; }
.action-row button { flex: 1; }
#whatsappText { width: 100%; min-height: 90px; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--cinza-linha); font-size: 12px; font-family: inherit; }
.voltar-link { display: block; text-align: center; color: var(--cinza-texto); font-size: 12.5px; margin-top: 14px; cursor: pointer; font-weight: 600; }
.voltar-link:hover { color: var(--azul); }

/* Clientes / Agenda */
.lista-item {
  background: var(--superficie); border: 1px solid var(--cinza-linha); border-radius: 14px;
  padding: 13px 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  transition: border-color .15s, box-shadow .15s;
}
.lista-item[style*="cursor:pointer"]:hover { border-color: var(--azul); box-shadow: var(--sombra); }
.lista-item .info { flex: 1; }
.lista-item .titulo-item { font-weight: 700; font-size: 14.5px; color: var(--escuro); }
.lista-item .sub-item { font-size: 12.5px; color: var(--cinza-texto); margin-top: 2px; }
.lista-item .acoes { display: flex; gap: 6px; }
.icon-btn {
  background: var(--superficie); border: 1px solid var(--cinza-linha); color: var(--cinza-texto);
  border-radius: 8px; width: 30px; height: 30px; font-size: 13px; cursor: pointer; flex-shrink: 0;
}
.icon-btn:hover { color: var(--azul); border-color: var(--azul); }
.icon-btn.perigo:hover { color: var(--erro); border-color: var(--erro); }
.status-tag {
  font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; display: inline-block; margin-top: 5px; letter-spacing: .02em;
}
.status-agendado { background: var(--azul-tinta); color: var(--azul-escuro); }
.status-concluido { background: var(--sucesso-bg); color: var(--sucesso); }
.status-cancelado { background: var(--erro-bg); color: #b91c1c; }
.dia-cabecalho { font-size: 12px; font-weight: 700; color: var(--cinza-texto); text-transform: uppercase; margin: 16px 0 8px; }
.dia-cabecalho:first-child { margin-top: 0; }
.vazio { color: var(--cinza-texto); font-size: 13.5px; text-align: center; padding: 28px 10px; }

/* Calendário */
.cal-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-cabecalho { font-size: 11px; color: var(--cinza-texto); margin-bottom: 4px; font-weight: 600; }
.cal-dia { padding: 10px 0 7px; border-radius: 10px; font-size: 13.5px; cursor: pointer; position: relative; color: var(--escuro); font-weight: 500; }
.cal-dia:hover { background: var(--cinza-claro); }
.cal-tem { font-weight: 700; color: var(--azul-escuro); background: var(--azul-tinta); }
.cal-hoje { outline: 1.5px solid var(--azul); outline-offset: -1.5px; }
.cal-dot { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--ambar); margin: 3px auto 0; }

/* Início */
.card-titulo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-titulo h3 { margin: 0; }
.card-icon-chip { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-icon-chip svg { width: 17px; height: 17px; }
.chip-azul { background: var(--azul-tinta); color: var(--azul-escuro); }
.chip-ambar { background: #fef3c7; color: var(--ambar-escuro); }
.chip-verde { background: var(--sucesso-bg); color: var(--sucesso); }
.saudacao { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 20px; color: var(--escuro); margin-bottom: 2px; }
.saudacao-sub { font-size: 12.5px; color: var(--cinza-texto); margin-bottom: 16px; text-transform: capitalize; }
.atalhos-row { display: flex; gap: 10px; margin-bottom: 16px; }
.atalho-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px;
  border-radius: 16px; border: none; cursor: pointer; text-align: center; font-family: inherit;
}
.atalho-btn svg { width: 20px; height: 20px; }
.atalho-btn span { font-size: 12.5px; font-weight: 700; }
.atalho-primario { background: var(--gradiente); color: #fff; box-shadow: 0 6px 18px rgba(37,99,235,.28); }
.atalho-secundario { background: var(--superficie); color: var(--azul); border: 1.5px solid var(--cinza-linha) !important; }
.kanban-secao { margin-bottom: 16px; }
.kanban-secao:last-child { margin-bottom: 0; }
.kanban-cabecalho { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.kanban-cabecalho .contagem { font-size: 12px; color: var(--cinza-texto); font-weight: 700; }
  /* Cards expansíveis de OS por status */
.os-status-card { border-radius: 14px; border: 1.5px solid var(--cinza-linha); margin-bottom: 10px; overflow: hidden; }
.os-status-card:last-child { margin-bottom: 0; }
.os-status-cabecalho { display: flex; justify-content: space-between; align-items: center; padding: 13px 15px; cursor: pointer; }
.os-status-info { display: flex; align-items: center; gap: 10px; }
.os-status-total { font-weight: 800; font-family: "Manrope", sans-serif; font-size: 14px; color: var(--escuro); }
.os-status-contagem-wrap { display: flex; align-items: center; gap: 6px; color: var(--cinza-texto); }
.os-status-seta { transition: transform .15s; }
.os-status-card.aberto .os-status-seta { transform: rotate(180deg); }
.os-status-corpo { padding: 0 15px 13px; }
.os-status-azul .os-status-cabecalho { background: var(--azul-tinta); }
.os-status-ambar .os-status-cabecalho { background: #fef3c7; }
.os-status-verde .os-status-cabecalho { background: var(--sucesso-bg); }

</style>
</head>
<body>
<div class="container">
  <div class="topo">
    <div>
      <h2 id="nomeEmpresa" style="margin-bottom: 4px;">Carregando...</h2>
      <span class="badge-plano" id="badgePlano">...</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab ativa" data-tab="inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span>Início</span>
    </div>
    <div class="tab" data-tab="avulso">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/></svg>
      <span>Orçamento</span>
    </div>
    <div class="tab" data-tab="contrato">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
      <span>Contrato</span>
    </div>
    <div class="tab" data-tab="clientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Clientes</span>
    </div>
    <div class="tab" data-tab="agenda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Agenda</span>
    </div>
    <div class="tab" data-tab="config">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      <span>Ajustes</span>
    </div>
  </div>

  <div id="conteudo">
    <div class="card"><p id="statusCarregando">Carregando seus dados...</p></div>
  </div>

  <p class="marca-dagua">feito no Cosmos Pro</p>
</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
